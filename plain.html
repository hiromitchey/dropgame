<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>ドロップス</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #12141c;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    /* 丸自体がカーソルの代わりになる。canvas の内外でカーソルの有無が
       変わると、枠からはみ出した瞬間に挙動が変わったように見えるため統一する */
    cursor: none;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    height: 100%;
    max-width: 100%;
    object-fit: contain;
    cursor: none;
    touch-action: none;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <!-- スプライトを使わず色の丸で描く。物理・判定・難易度は index.html と完全に同一 -->
  <script>window.DROP_DELTA_PLAIN = true;</script>
  <script src="./js/game.js"></script>
</body>
</html>
