<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>フルーツドロップス</title>
<!-- 丸ゴシック。読み込めない環境では system-ui で描かれる -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #12141c;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    height: 100%;
    max-width: 100%;
    object-fit: contain;
    touch-action: none;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <!-- ページを開くたびに読み直す（?v= を毎回変える）。順番は async=false で守る -->
  <script>
    (function () {
      var v = Date.now();
      ['./js/sound.js', './js/game.js'].forEach(function (src) {
        var s = document.createElement('script');
        s.src = src + '?v=' + v;
        s.async = false;
        document.body.appendChild(s);
      });
    })();
  </script>
  <!-- アクセス解析（Cloudflare Web Analytics）。Cookie は使わない。広告ブロッカーがあると数えられない -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
          data-cf-beacon='{"token": "9b7b760497c049daacc80d95f646073d"}'></script>
</body>
</html>
